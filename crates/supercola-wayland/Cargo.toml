[package]
name = "supercola-wayland"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
supercola-core = { path = "../supercola-core" }
libc = "0.2"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }
cosmic-protocols = { git = "https://github.com/pop-os/cosmic-protocols", default-features = false, features = ["client"] }
xkbcommon = { version = "0.8", default-features = false }
